services:
  meld:
    image: ghcr.io/simhue/meld-orchestrator:0.2.1-SNAPSHOT
    # remove when combining meld compose with aktin compose
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MELD_API_HOST=0.0.0.0
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - TZ=${TZ:-Europe/Berlin}
      - LOG_LEVEL=DEBUG
    restart: unless-stopped
    secrets:
      - postgres_password
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "contracts:/contracts"
    privileged: false
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  contracts:


secrets:
  postgres_password:
    file: ./db_password.txt
