name: Update contract schema reference

on:
  push:
    paths:
      - "MELD/resources/contract.schema.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contract-schema-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema documentation and model generators
        run: python -m pip install --upgrade pip json-schema-for-humans datamodel-code-generator

      - name: Regenerate contract schema reference
        working-directory: scripts
        run: bash update_docs.sh

      - name: Commit updated reference
        run: |
          set -eu

          git add docs/generated/contract_schema_reference.md MELD/ModelManager/generated
          if git diff --cached --quiet -- docs/generated/contract_schema_reference.md MELD/ModelManager/generated; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update schema reference and generated models [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
