name: Build and publish example images

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: example-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML helper
        run: python -m pip install --disable-pip-version-check --no-input pyyaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build, push, and update affected example contracts
        run: |
          python scripts/publish_example_images.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}"

      - name: Commit updated digests
        run: |
          set -euo pipefail

          mapfile -t contracts < <(git diff --name-only -- 'examples/*/resources/contract.yaml')
          if ((${#contracts[@]} == 0)); then
            echo "No contract digests changed."
            exit 0
          fi

          git diff -- "${contracts[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${contracts[@]}"
          git commit -m "chore: update example image digests [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
