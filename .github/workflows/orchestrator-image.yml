name: Build and publish orchestrator image

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: orchestrator-image-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare and push release version
        id: version
        uses: ./.github/actions/orchestrator-version
        with:
          phase: prepare
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Determine image tag
        id: image
        if: steps.version.outputs.complete != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meld-orchestrator:$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.complete != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.complete != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push orchestrator image
        if: steps.version.outputs.complete != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./MELD
          file: ./MELD/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Restore and push SNAPSHOT version
        if: steps.version.outputs.complete != 'true'
        uses: ./.github/actions/orchestrator-version
        with:
          phase: snapshot
          tag: ${{ steps.version.outputs.version }}
