name: Build and publish orchestrator image

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: orchestrator-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Check main branch and determine image version
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git merge-base --is-ancestor HEAD origin/main
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^LABEL org.opencontainers.image.version="\([^"]*\)"$/\1/p' MELD/Dockerfile)
          fi

          if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meld-orchestrator:$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: ./MELD
          file: ./MELD/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
